<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Moodboard Board Surface -->
  <rect width="800" height="600" fill="#EAE6DE"/>
  
  <text x="35" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#141413" letter-spacing="1">PRE-PRO / MOODBOARD DIRECTION: REF-08</text>
  <line x1="35" y1="58" x2="765" y2="58" stroke="#D1CDC4" stroke-width="1"/>

  <!-- Pin 1: Volcanic Basalt Texture -->
  <g transform="translate(35, 75)">
    <rect width="320" height="230" fill="#2E2C29" rx="3"/>
    <ellipse cx="160" cy="115" rx="130" ry="70" fill="#1C1B19" opacity="0.8"/>
    <text x="15" y="210" font-family="monospace" font-size="9" fill="#A8A29E">MATTE VOLCANIC BASALT (3:1 KEY-TO-FILL)</text>
  </g>

  <!-- Pin 2: Morning Fog / Mist Diffuser -->
  <g transform="translate(380, 75)">
    <rect width="385" height="150" fill="#D6D3CD" rx="3"/>
    <text x="15" y="130" font-family="monospace" font-size="9" fill="#57534E">ATMOSPHERIC DIFFUSION / 4800K OVERCAST</text>
  </g>

  <!-- Pin 3: Chromatic Swatches -->
  <g transform="translate(380, 245)">
    <rect x="0" y="0" width="70" height="60" fill="#141413"/>
    <rect x="75" y="0" width="70" height="60" fill="#4B4842"/>
    <rect x="150" y="0" width="70" height="60" fill="#878378"/>
    <rect x="225" y="0" width="70" height="60" fill="#C2BDAF"/>
    <rect x="300" y="0" width="85" height="60" fill="#D97706"/>
    <text x="0" y="75" font-family="monospace" font-size="8" fill="#78716C">CHROMATIC MINERAL PALETTE</text>
  </g>

  <!-- Pin 4: Lighting Diagram Sketch -->
  <g transform="translate(35, 330)">
    <rect width="730" height="230" fill="#FAF9F5" stroke="#DDD9CE" stroke-width="1" rx="3"/>
    <text x="25" y="35" font-family="serif" font-size="16" font-weight="bold" fill="#141413">Set Lighting Architecture Blueprint</text>
    <text x="25" y="55" font-family="sans-serif" font-size="10" fill="#64625C">Raking 3200K tungsten edge on bottle shoulder + 24x36 softbox overhead</text>
    
    <!-- Visual schematic -->
    <circle cx="160" cy="135" r="30" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="160" y="138" text-anchor="middle" font-family="monospace" font-size="8" fill="#854D0E">OVERHEAD</text>
    
    <rect x="320" y="115" width="80" height="50" rx="4" fill="#1C1917"/>
    <text x="360" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#FAF9F5">PLINTH</text>

    <!-- Raking Light Beam -->
    <polygon points="560,90 620,130 560,170" fill="#FDE68A" opacity="0.6"/>
    <text x="590" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#78350F">RAKING TUNGSTEN (EDGE)</text>
  </g>
</svg>
