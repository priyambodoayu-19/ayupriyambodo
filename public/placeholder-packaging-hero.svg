<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Blueprint / Cad Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6E3DA" stroke-width="0.8"/>
    </pattern>
    <pattern id="fineGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#EFECE5" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Background Technical Board -->
  <rect width="1200" height="750" fill="#FAF9F5"/>
  <rect width="1200" height="750" fill="url(#fineGrid)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Outer Blueprint Margins -->
  <rect x="80" y="50" width="1040" height="650" fill="none" stroke="#C5C0B3" stroke-width="1.5"/>

  <!-- Pre-Press Color Bar (CMYK + Spots) Top Right -->
  <g transform="translate(820, 75)">
    <rect x="0" y="0" width="30" height="14" fill="#00A0E9"/>
    <rect x="35" y="0" width="30" height="14" fill="#E4007F"/>
    <rect x="70" y="0" width="30" height="14" fill="#FFF100"/>
    <rect x="105" y="0" width="30" height="14" fill="#1D1D1B"/>
    <rect x="140" y="0" width="30" height="14" fill="#887B6C"/> <!-- Pantone Spot -->
    <rect x="175" y="0" width="30" height="14" fill="#C5A059"/> <!-- Gold Foil -->
    <text x="215" y="11" font-family="monospace" font-size="9" fill="#757065">D50 CALIBRATED</text>
  </g>

  <!-- Technical Dieline Info Header -->
  <text x="110" y="85" font-family="monospace" font-size="14" font-weight="bold" fill="#141413" letter-spacing="1">DIELINE DRAWING: SKU-CRTN-05B</text>
  <text x="110" y="105" font-family="monospace" font-size="10" fill="#757065">SUBSTRATE: 350 GSM C1S BLEACHED BOARD | BLEED: 3.0mm | FLUTE: N/A</text>
  <line x1="110" y1="120" x2="1090" y2="120" stroke="#DDD8CC" stroke-width="1"/>

  <!-- Registration Targets (Corner Crosshairs) -->
  <g stroke="#141413" stroke-width="0.8" fill="none">
    <!-- Top Left -->
    <circle cx="95" cy="65" r="8"/>
    <line x1="82" y1="65" x2="108" y2="65"/>
    <line x1="95" y1="52" x2="95" y2="78"/>
    <!-- Bottom Right -->
    <circle cx="1105" cy="685" r="8"/>
    <line x1="1092" y1="685" x2="1118" y2="685"/>
    <line x1="1105" y1="672" x2="1105" y2="698"/>
  </g>

  <!-- THE PACKAGING DIELINE (Unfolded Carton Layout) -->
  <g transform="translate(180, 160)">
    <!-- Bleed Margin (Dotted Red External) -->
    <rect x="-10" y="-10" width="840" height="420" fill="none" stroke="#E57373" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Main Carton Board Fill -->
    <rect x="0" y="80" width="820" height="240" fill="#F4F1E8" opacity="0.9" stroke="#E11D48" stroke-width="1.8"/>

    <!-- Glue Flap (Far Left) -->
    <polygon points="0,80 -35,95 -35,305 0,320" fill="#E8E4DA" stroke="#E11D48" stroke-width="1.8"/>
    <text x="-25" y="200" font-family="monospace" font-size="8" fill="#E11D48" transform="rotate(-90 -25,200)">GLUE FLAP (VARNISH FREE)</text>

    <!-- 4 Main Panels Crease Lines (Dashed Cyan / Fold) -->
    <!-- Panel 1: Back (width 190) -->
    <line x1="190" y1="80" x2="190" y2="320" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Panel 2: Side (width 110) -->
    <line x1="300" y1="80" x2="300" y2="320" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Panel 3: Front (width 190) -->
    <line x1="490" y1="80" x2="490" y2="320" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Panel 4: Side (width 110) -->
    <line x1="600" y1="80" x2="600" y2="320" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Top Closure Flaps -->
    <!-- Tuck Flap on Front Panel -->
    <path d="M 300 80 L 300 15 Q 310 0 395 0 Q 480 0 490 15 L 490 80 Z" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>
    <line x1="300" y1="80" x2="490" y2="80" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="395" y="45" text-anchor="middle" font-family="monospace" font-size="9" fill="#0284C7">TUCK TOP CLOSURE</text>

    <!-- Top Dust Flaps (Left & Right Sides) -->
    <polygon points="190,80 190,20 280,35 300,80" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>
    <polygon points="490,80 510,35 600,20 600,80" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>

    <!-- Bottom Auto-Lock / Tuck Panels -->
    <path d="M 300 320 L 300 390 L 490 390 L 490 320 Z" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>
    <line x1="300" y1="320" x2="490" y2="320" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="190,320 200,375 290,360 300,320" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>
    <polygon points="490,320 500,360 590,375 600,320" fill="#F4F1E8" stroke="#E11D48" stroke-width="1.8"/>

    <!-- Front Panel Content & Foil Spec Overlay -->
    <g transform="translate(320, 110)">
      <rect x="0" y="0" width="150" height="180" fill="#FFFFFF" opacity="0.6"/>
      <!-- Foil Stamp Area Highlight -->
      <rect x="15" y="25" width="120" height="35" fill="#FEF08A" stroke="#CA8A04" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="75" y="48" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#854D0E">NIDHI</text>
      <text x="75" y="70" text-anchor="middle" font-family="monospace" font-size="7" fill="#CA8A04">[FOIL STAMP: KURZ 388]</text>

      <!-- Emboss Area -->
      <rect x="25" y="90" width="100" height="20" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="75" y="103" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#0369A1">[BLIND DEBOSS: 0.4MM]</text>

      <!-- Barcode Placement -->
      <rect x="35" y="145" width="80" height="25" fill="#FFFFFF" stroke="#64748B" stroke-width="0.8"/>
      <line x1="45" y1="150" x2="45" y2="165" stroke="#1E293B" stroke-width="1.5"/>
      <line x1="50" y1="150" x2="50" y2="165" stroke="#1E293B" stroke-width="0.8"/>
      <line x1="55" y1="150" x2="55" y2="165" stroke="#1E293B" stroke-width="2"/>
      <line x1="62" y1="150" x2="62" y2="165" stroke="#1E293B" stroke-width="1"/>
      <line x1="70" y1="150" x2="70" y2="165" stroke="#1E293B" stroke-width="1.5"/>
      <line x1="78" y1="150" x2="78" y2="165" stroke="#1E293B" stroke-width="0.8"/>
      <line x1="85" y1="150" x2="85" y2="165" stroke="#1E293B" stroke-width="2.5"/>
      <text x="75" y="176" text-anchor="middle" font-family="monospace" font-size="5" fill="#475569">8 991234 567890</text>
    </g>

    <!-- Dimension Callout Arrows -->
    <g stroke="#64748B" stroke-width="1" fill="#64748B">
      <line x1="300" y1="340" x2="490" y2="340"/>
      <polygon points="300,340 306,337 306,343"/>
      <polygon points="490,340 484,337 484,343"/>
      <text x="395" y="355" text-anchor="middle" font-family="monospace" font-size="9" fill="#334155">W: 70.0 mm</text>
    </g>
  </g>

  <!-- Legend / Pre-Press Annotations Footer -->
  <g transform="translate(110, 625)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#E11D48" stroke-width="2"/>
    <text x="35" y="4" font-family="monospace" font-size="9" fill="#475569">CUT LINE (100% DIE)</text>

    <line x1="190" y1="0" x2="215" y2="0" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="225" y="4" font-family="monospace" font-size="9" fill="#475569">CREASE / FOLD (2-PT)</text>

    <line x1="400" y1="0" x2="425" y2="0" stroke="#E57373" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="435" y="4" font-family="monospace" font-size="9" fill="#475569">BLEED PERIMETER (3.0mm)</text>

    <rect x="620" y="-8" width="16" height="16" fill="#FEF08A" stroke="#CA8A04" stroke-width="1"/>
    <text x="645" y="4" font-family="monospace" font-size="9" fill="#475569">FOIL / EMBOSS SEPARATION</text>

    <text x="960" y="4" text-anchor="end" font-family="monospace" font-size="10" font-weight="bold" fill="#141413">QC: PRESS-READY APPROVED</text>
  </g>
</svg>
