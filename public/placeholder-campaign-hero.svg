<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="spotlight" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A3732"/>
      <stop offset="60%" stop-color="#1B1A18"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </radialGradient>
    <linearGradient id="warmRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#713F12" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark Cinematic Studio Canvas -->
  <rect width="1200" height="750" fill="url(#spotlight)"/>

  <!-- Cinema 2.39:1 Letterbox Mattes -->
  <rect x="0" y="0" width="1200" height="60" fill="#000000"/>
  <rect x="0" y="690" width="1200" height="60" fill="#000000"/>

  <!-- Production Camera Metadata Overlay -->
  <text x="60" y="40" font-family="monospace" font-size="11" fill="#78716C" letter-spacing="2">REC [●] 00:14:22:08</text>
  <text x="400" y="40" font-family="monospace" font-size="11" fill="#78716C">ALEXA MINI LF · 50MM ANAMORPHIC · T2.0</text>
  <text x="1140" y="40" text-anchor="end" font-family="monospace" font-size="11" fill="#78716C">FPS: 48 · EI: 800 · 3200K</text>

  <!-- Wet Basalt Mineral Plinth (3D sculpted set prop) -->
  <polygon points="340,560 860,560 960,630 240,630" fill="#1C1B19"/>
  <polygon points="340,560 420,460 780,460 860,560" fill="#292825"/>
  <polygon points="420,460 480,430 720,430 780,460" fill="#3D3B37"/>

  <!-- Dramatic Atmospheric Water Mist (Subtle Glow) -->
  <circle cx="620" cy="360" r="220" fill="#44403C" opacity="0.25" filter="blur(40px)"/>

  <!-- Hero Bottle Silhouette with High-Impact Raking Edge Light -->
  <g transform="translate(540, 210)">
    <!-- Dropper / Pipette top -->
    <path d="M 50 10 Q 60 -5 70 10 Z" fill="#1C1917"/>
    <rect x="52" y="10" width="16" height="30" fill="#292524"/>
    <rect x="47" y="40" width="26" height="15" fill="#78716C"/>
    
    <!-- Bottle Body (Dark Glass with Rim Light Accent) -->
    <rect x="25" y="55" width="70" height="260" rx="14" fill="#171513" stroke="#57534E" stroke-width="0.8"/>
    <!-- Gold/Amber Rim Highlight Line on right edge -->
    <path d="M 88 65 L 88 300" stroke="#FBBF24" stroke-width="2.5" opacity="0.85" filter="blur(1px)"/>

    <!-- Subtle Label Illumination -->
    <rect x="33" y="110" width="54" height="140" fill="#E7E5E4" opacity="0.85"/>
    <text x="40" y="140" font-family="serif" font-size="12" font-weight="bold" fill="#0C0A09">NIDHI</text>
    <text x="40" y="160" font-family="sans-serif" font-size="5.5" fill="#44403C">RECOVERY ELIXIR</text>
  </g>

  <!-- Water Droplet Highlights on Basalt -->
  <ellipse cx="460" cy="480" rx="8" ry="3" fill="#D6D3D1" opacity="0.7"/>
  <ellipse cx="680" cy="510" rx="12" ry="4" fill="#D6D3D1" opacity="0.5"/>
  <ellipse cx="740" cy="470" rx="6" ry="2" fill="#E7E5E4" opacity="0.8"/>

  <!-- Playback Scrubber / Motion Direction Overlay -->
  <g transform="translate(60, 640)">
    <!-- Play/Pause Icon and Timeline -->
    <polygon points="0,0 0,16 14,8" fill="#FAF9F5"/>
    <rect x="30" y="6" width="1000" height="4" rx="2" fill="#44403C"/>
    <rect x="30" y="6" width="460" height="4" rx="2" fill="#FAF9F5"/>
    <circle cx="490" cy="8" r="6" fill="#FAF9F5"/>
    <text x="1050" y="11" font-family="monospace" font-size="10" fill="#A8A29E">00:30 COMMERCIAL CUT</text>
  </g>

  <!-- Bottom Track Label -->
  <text x="60" y="725" font-family="sans-serif" font-size="11" fill="#78716C" letter-spacing="1">SCENE 04: MACRO TEXTURE &amp; PRODUCT ILLUMINATION</text>
  <text x="1140" y="725" text-anchor="end" font-family="sans-serif" font-size="11" fill="#78716C">DIRECTED BY AYU PRIYAMBODO</text>
</svg>
